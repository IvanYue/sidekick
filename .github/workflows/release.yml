name: Release

# 推一个 `v*` 的 tag 就出全套安装包并自动建 Release：
#   git tag v2.0.0 && git push origin v2.0.0
#
# 手动重跑：Actions → Release → Run workflow，在「Use workflow from」下拉里
# 选中要发布的 tag（不要选 main，否则版本号会变成 "main"）。
#
# 产物：
#   Linux   sidekick-linux-<ver>-x86_64.tar.gz（解压即用）、...-x86_64.AppImage
#   macOS   sidekick-macos-<ver>.zip（含 .app）、sidekick-macos-<ver>.dmg
#   Windows sidekick-windows-<ver>-x64.zip（免安装 exe）、...-x64.msix
#
# 版本号取自 tag（去掉 `v` 前缀），由 tool/ci_stamp.dart 写进 pubspec.yaml 与
# lib/src/version.dart，再分别落到 Info.plist / msix_version。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 与本地开发环境对齐；升级 Flutter 时同步改这里
  FLUTTER_VERSION: '3.47.7'

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      msix: ${{ steps.version.outputs.msix }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Resolve version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::必须在 tag 上运行（当前 $GITHUB_REF）。手动触发时请在"
              echo "::error::『Use workflow from』下拉里选中要发布的 tag，而不是 main。"
              exit 1
              ;;
          esac
          tag="$GITHUB_REF_NAME"
          value="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          # msix 要求四段版本号
          echo "msix=$value.0" >> "$GITHUB_OUTPUT"
          echo "发布版本：$value"

  linux:
    name: Build Linux
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev libfuse2

      - name: Stamp version
        run: |
          dart tool/ci_stamp.dart ${{ needs.prepare.outputs.version }}
          flutter pub get
          flutter analyze

      - name: Build
        run: flutter build linux --release

      # 免安装：解压即用，任何发行版都能跑
      - name: Package tarball
        run: |
          cd build/linux/x64/release
          tar -czf "$GITHUB_WORKSPACE/sidekick-linux-${{ needs.prepare.outputs.version }}-x86_64.tar.gz" bundle

      # AppImage 依赖 appimage-builder，该工具本身偶发失败；挂了也不该拖垮
      # 整个 release（tar.gz 已覆盖 Linux）。
      - name: Build AppImage
        continue-on-error: true
        run: |
          sed -i "s/version: latest/version: ${{ needs.prepare.outputs.version }}/" AppImageBuilder.yml
          wget -q -O appimage-builder \
            https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage
          chmod +x appimage-builder
          sudo mv appimage-builder /usr/local/bin/
          appimage-builder --recipe AppImageBuilder.yml
          mv Sidekick-latest-x86_64.AppImage \
            "sidekick-linux-${{ needs.prepare.outputs.version }}-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            sidekick-linux-*.tar.gz
            sidekick-linux-*.AppImage
          if-no-files-found: warn

  macos:
    name: Build macOS
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Stamp version
        run: |
          dart tool/ci_stamp.dart ${{ needs.prepare.outputs.version }}
          flutter pub get
          flutter analyze

      - name: Build
        run: flutter build macos --release

      - name: Package zip
        run: |
          cd build/macos/Build/Products/Release
          zip -qry "$GITHUB_WORKSPACE/sidekick-macos-${{ needs.prepare.outputs.version }}.zip" \
            Sidekick.app

      # CI 上没有分发证书，这里做的只是把 .app 装进带背景图的 DMG；失败时
      # zip 仍可用。
      - name: Create DMG
        continue-on-error: true
        run: |
          brew install create-dmg
          ./scripts/create_mac_dmg.sh
          mv build/macos/Build/Products/Release/Sidekick.dmg \
            "sidekick-macos-${{ needs.prepare.outputs.version }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            sidekick-macos-*.zip
            sidekick-macos-*.dmg
          if-no-files-found: warn

  windows:
    name: Build Windows
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Stamp version
        shell: bash
        run: |
          dart tool/ci_stamp.dart ${{ needs.prepare.outputs.version }}
          flutter pub get
          flutter analyze

      # 仓库里没有可用的发布证书（上游那份的密码在别人的 secret 里），这里生成
      # 一次性自签名证书。用户首次安装需手动信任，或改用自有 .pfx。
      - name: Create signing certificate
        shell: pwsh
        run: |
          $password = [guid]::NewGuid().ToString()
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject "CN=Sidekick" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -NotAfter (Get-Date).AddYears(3)
          Export-PfxCertificate -Cert $cert -FilePath windows\release-cert.pfx `
            -Password (ConvertTo-SecureString -String $password -Force -AsPlainText)
          Export-Certificate -Cert $cert -FilePath windows\release-cert.cer | Out-Null
          echo "::add-mask::$password"
          echo "CERT_PASS=$password" >> $env:GITHUB_ENV

      - name: Write msix_config
        shell: bash
        env:
          MSIX_VERSION: ${{ needs.prepare.outputs.msix }}
        run: |
          # 正文写到独立文件再追加，避免 heredoc 的缩进混进 YAML
          cat > /tmp/msix_config.yaml <<EOF

          msix_config:
            display_name: Sidekick
            publisher_display_name: Sidekick
            identity_name: SidekickContributors.Sidekick
            publisher: CN=Sidekick
            msix_version: ${MSIX_VERSION}
            logo_path: assets\\promo-windows\\icon.png
            architecture: x64
            capabilities: internetClient,removableStorage
            certificate_path: windows\\release-cert.pfx
            certificate_password: ${CERT_PASS}
            install_certificate: false
            build_windows: false
            store: false
          EOF
          cat /tmp/msix_config.yaml >> pubspec.yaml
          flutter pub get
          tail -16 pubspec.yaml

      # 免安装：整个 Release 目录打包，解压后直接跑 sidekick.exe
      - name: Build Windows
        run: |
          flutter build windows --release
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath "sidekick-windows-${{ needs.prepare.outputs.version }}-x64.zip" -Force

      - name: Build MSIX
        run: dart run msix:create

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            sidekick-windows-*.zip
            build/windows/x64/runner/Release/sidekick.msix
          if-no-files-found: warn

  publish:
    name: Publish Release
    needs: [prepare, linux, macos, windows]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Sidekick ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: false